
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Magical Christmas Tree</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #090414;
      font-family: Arial, sans-serif;
    }

    #scene {
      width: 100vw;
      height: 100vh;
    }

    .title {
      position: absolute;
      top: 35px;
      width: 100%;
      text-align: center;
      color: #ffd8f5;
      font-size: 30px;
      letter-spacing: 5px;
      text-shadow: 0 0 20px #ff65d4;
      pointer-events: none;
    }

    .subtitle {
      position: absolute;
      bottom: 35px;
      width: 100%;
      text-align: center;
      color: #d9baff;
      font-size: 13px;
      letter-spacing: 3px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="title">MERRY CHRISTMAS ✨</div>
  <div class="subtitle">MY MAGICAL LITTLE UNIVERSE</div>
  <div id="scene"></div>

  <script type="module">
    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    // 创建 3D 场景
    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#090414");

    // 创建摄像机
    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 2, 12);

    // 创建渲染器
    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    document.getElementById("scene").appendChild(
      renderer.domElement
    );

    // 添加环境光
    const light = new THREE.AmbientLight(
      0xffffff,
      1.5
    );

    scene.add(light);

    // 圣诞树的主体
    const treeGroup = new THREE.Group();
    scene.add(treeGroup);

    const treeGeometry = new THREE.ConeGeometry(
      3,
      7,
      64
    );

    const treeMaterial = new THREE.MeshStandardMaterial({
      color: "#20c77a",
      roughness: 0.7,
      metalness: 0.2
    });

    const tree = new THREE.Mesh(
      treeGeometry,
      treeMaterial
    );

    tree.position.y = 0;
    treeGroup.add(tree);

    // 地面
    const groundGeometry = new THREE.CircleGeometry(
      4,
      64
    );

    const groundMaterial = new THREE.MeshBasicMaterial({
      color: "#26113b"
    });

    const ground = new THREE.Mesh(
      groundGeometry,
      groundMaterial
    );

    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -3.6;
    scene.add(ground);

    // 动画
    function animate() {
      requestAnimationFrame(animate);

      treeGroup.rotation.y += 0.005;

      renderer.render(scene, camera);
    }

    animate();

    // 适应浏览器窗口
    window.addEventListener("resize", () => {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });
  </script>

</body>
</html>
